<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Market</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f1a;
  color: white;
}

.header {
  background: linear-gradient(90deg, purple, blue);
  padding: 15px;
  text-align: center;
  font-weight: bold;
}

.menu {
  display: flex;
  justify-content: space-around;
  background: #1c1c2e;
  padding: 10px;
}

.menu button {
  background: none;
  border: none;
  color: white;
  font-size: 16px;
}

.cards {
  padding: 10px;
}

.card {
  background: #1c1c2e;
  border-radius: 15px;
  padding: 10px;
  margin-bottom: 10px;
  cursor: pointer;
}

.price {
  color: lime;
}

/* Скрытые страницы */
.page {
  display: none;
  padding: 15px;
}
</style>

</head>

<body>

<div class="header">EV1CHEK ACCOUNTS</div>

<div class="menu">
  <button onclick="showPage('shop')">Shop</button>
  <button onclick="showPage('profile')">Profile</button>
</div>

<!-- SHOP -->
<div id="shop" class="cards">

  <div class="card" onclick="openItem('acc1')">
    <h3>Аккаунт #1</h3>
    <p>Пато</p>
    <p class="price">₽450</p>
  </div>

  <div class="card" onclick="openItem('acc2')">
    <h3>Аккаунт #2</h3>
    <p>Бейл</p>
    <p class="price">₽850</p>
  </div>

</div>

<!-- ITEM PAGE -->
<div id="item" class="page">
  <button onclick="showPage('shop')">← Назад</button>
  <h2 id="itemTitle"></h2>
  <p id="itemDesc"></p>
  <p class="price" id="itemPrice"></p>
  <button onclick="buy()">Купить</button>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
  <h2>Profile</h2>
  <p>Тут будет профиль</p>
</div>

<script>
const data = {
  acc1: {
    title: "Аккаунт #1",
    desc: "Пато",
    price: "450₽"
  },
  acc2: {
    title: "Account #2",
    desc: "Бейл",
    price: "850₽"
  }
};

function showPage(page) {
  document.getElementById("shop").style.display = "none";
  document.getElementById("item").style.display = "none";
  document.getElementById("profile").style.display = "none";

  document.getElementById(page).style.display = "block";
}

function openItem(id) {
  const item = data[id];

  document.getElementById("itemTitle").innerText = item.title;
  document.getElementById("itemDesc").innerText = item.desc;
  document.getElementById("itemPrice").innerText = item.price;

  showPage("item");
}

function buy() {
  alert("Покупка пока не подключена");
}
</script>

</body>
</html>
