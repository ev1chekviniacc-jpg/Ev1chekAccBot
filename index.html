<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV1CHEK MARKET</title>

<!-- Шрифт -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#06060c;
  --card:#121226;
  --card2:#18183a;
  --accent1:#7a2bff;
  --accent2:#00e7ff;
  --text:#ffffff;
  --muted:#8b8ba7;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top, #0d0d1f, #05050a);
  color:var(--text);
}

/* HEADER */
.header{
  padding:18px;
  text-align:center;
  font-weight:800;
  font-size:20px;
  background: linear-gradient(90deg,var(--accent1),var(--accent2));
  letter-spacing:1px;
}

/* SEARCH */
.search{
  padding:10px;
}
.search input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  background:#0f0f22;
  color:white;
}

/* CATEGORY */
.categories{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px;
}
.cat{
  padding:8px 14px;
  background:#111126;
  border-radius:999px;
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
}
.cat.active{
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:black;
  font-weight:600;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:12px;
}

/* CARD */
.card{
  background:linear-gradient(145deg,var(--card),var(--card2));
  border-radius:16px;
  overflow:hidden;
  position:relative;
  transition:.25s;
}
.card:active{transform:scale(.95)}

.card::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:16px;
  padding:1px;
  background:linear-gradient(90deg,var(--accent2),var(--accent1));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.info{
  padding:10px;
}

.title{
  font-weight:600;
  font-size:14px;
}

.price{
  color:#00ffcc;
  font-weight:700;
  margin-top:5px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:flex-end;
}

.modalContent{
  width:100%;
  background:#0d0d1f;
  border-radius:20px 20px 0 0;
  padding:15px;
  animation:slideUp .3s ease;
}

@keyframes slideUp{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

.buyBtn{
  margin-top:10px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,var(--accent2),var(--accent1));
  font-weight:700;
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:#0c0c1a;
  display:flex;
  justify-content:space-around;
  padding:10px;
}
.nav button{
  background:none;
  border:none;
  color:var(--muted);
}
.nav button.active{
  color:white;
}
</style>
</head>

<body>

<div class="header">EV1CHEK MARKET</div>

<div class="search">
  <input placeholder="Поиск...">
</div>

<div class="categories">
  <div class="cat active" onclick="setFilter('all',this)">All</div>
  <div class="cat" onclick="setFilter('cheap',this)">Cheap</div>
  <div class="cat" onclick="setFilter('top',this)">Top</div>
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modalContent">
    <img id="mImg" style="width:100%; border-radius:12px;">
    <h2 id="mTitle"></h2>
    <p id="mDesc"></p>
    <div class="price" id="mPrice"></div>
    <button class="buyBtn" onclick="buy()">Купить</button>
  </div>
</div>

<div class="nav">
  <button class="active" onclick="openTab('shop',this)">Shop</button>
  <button onclick="openTab('profile',this)">Profile</button>
</div>

<script>
const items = [
  {
    title:"Аккаунт #1",
    desc:"Пато + легенды",
    price:450,
    type:"cheap",
    img:"https://i.imgur.com/gi0KlGv.jpeg"
  },
  {
    title:"Аккаунт #2",
    desc:"Бейл + топ состав",
    price:850,
    type:"top",
    img:"https://i.imgur.com/Iuh2ZYu.jpeg"
  }
];

const grid = document.getElementById("grid");

items.forEach((item,i)=>{
  const el = document.createElement("div");
  el.className="card";
  el.innerHTML=`
    <img src="${item.img}">
    <div class="info">
      <div class="title">${item.title}</div>
      <div class="price">${item.price}</div>
    </div>
  `;
  el.onclick=()=>openItem(i);
  grid.appendChild(el);
});

function openItem(i){
  const item=items[i];
  document.getElementById("mImg").src=item.img;
  document.getElementById("mTitle").innerText=item.title;
  document.getElementById("mDesc").innerText=item.desc;
  document.getElementById("mPrice").innerText=item.price;
  document.getElementById("modal").style.display="flex";
}

document.getElementById("modal").onclick=(e)=>{
  if(e.target.id==="modal"){
    e.target.style.display="none";
  }
}

function buy(){
  const name=document.getElementById("mTitle").innerText;
  window.location.href="https://t.me/Ev1chek?text=Хочу купить "+name;
}

function render(filter="all"){
  grid.innerHTML="";

  items
    .filter(item=>{
      if(filter==="all") return true;
      return item.type===filter;
    })
    .forEach((item,i)=>{
      const el=document.createElement("div");
      el.className="card";
      el.innerHTML=`
        <img src="${item.img}">
        <div class="info">
          <div class="title">${item.title}</div>
          <div class="price">₽${item.price}</div>
        </div>
      `;
      el.onclick=()=>openItem(i);
      grid.appendChild(el);
    });
}

function setFilter(type,el){
  document.querySelectorAll(".cat").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  render(type);
}

function openTab(tab,el){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  el.classList.add("active");

  if(tab==="shop"){
    document.getElementById("grid").style.display="grid";
    document.getElementById("profilePage").style.display="none";
  }else{
    document.getElementById("grid").style.display="none";
    document.getElementById("profilePage").style.display="block";
  }
}

</script>
<div id="profilePage" style="display:none; padding:20px;">
  <h2>Профиль</h2>
  <p>Тут будет инфа о тебе</p>
</div>

</body>
</html>
